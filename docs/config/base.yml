site_name: Request Logger
site_url: https://angel-valdezzz.github.io/robotframework-request-logger/
repo_url: https://github.com/angel-valdezzz/robotframework-request-logger
repo_name: RequestLogger
copyright: Robot Framework Request Logger · HTTP console evidence
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  name: material
  custom_dir: docs/overrides
  icon:
      repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - toc.follow
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.tabs.link
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
plugins:
  - search
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - abbr
  - footnotes
  - pymdownx.snippets
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - assets/mermaid.min.js
  - assets/landing.js
  - assets/keyword-links.js
  - assets/theme-gallery.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/angel-valdezzz/robotframework-request-logger
      name: Request Logger on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/robotframework-request-logger/
      name: Request Logger on PyPI
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-request-logger/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-request-logger/es/
      lang: es

extra_css:
  - assets/stylesheets/landing.css
  - assets/stylesheets/standard.css
  - assets/stylesheets/theme-gallery.css
  - assets/stylesheets/visual.css
