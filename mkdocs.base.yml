site_name: Robot Framework Request Logger
site_url: https://angel-valdezzz.github.io/robotframework-request-logger/
repo_url: https://github.com/angel-valdezzz/robotframework-request-logger
repo_name: angel-valdezzz/robotframework-request-logger
copyright: Robot Framework Request Logger · HTTP console evidence
theme:
  font: false
  name: material
  custom_dir: overrides
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - assets/external.js
  - assets/theme-gallery.js
extra:
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-request-logger/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-request-logger/es/
      lang: es

extra_css:
  - assets/stylesheets/standard.css
  - assets/stylesheets/theme-gallery.css
