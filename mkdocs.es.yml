INHERIT: mkdocs.base.yml
site_url: https://angel-valdezzz.github.io/robotframework-request-logger/es/
docs_dir: docs/es
site_dir: build/site-es
edit_uri: edit/main/docs/es/
theme:
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Modo claro
plugins:
  - search:
      lang: es
nav:
  - Inicio: index.md
  - Manual de usuario:
      - Uso y assertions: usage.md
      - CI y compatibilidad: ci.md
  - Referencia de keywords: keywords/index.html
  - Desarrollo y publicación: development.md
  - Ejemplos visuales: console.md
