INHERIT: mkdocs.base.yml
site_url: https://angel-valdezzz.github.io/robotframework-request-logger/es/
docs_dir: docs/es
site_dir: build/site-es
edit_uri: edit/main/docs/es/
theme:
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
plugins:
  - search:
      lang: es
nav:
  - Inicio: index.md
  - Manual de usuario:
      - Uso y assertions: usage.md
      - CI y compatibilidad: ci.md
  - Referencia de keywords: keywords/index.html
  - Desarrollo y publicación: development.md
  - Ejemplos visuales: console.md
  - Temas: themes.md
