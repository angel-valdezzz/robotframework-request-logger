site_name: Robot Framework Request Logger
site_url: https://angel-valdezzz.github.io/robotframework-request-logger/
repo_url: https://github.com/angel-valdezzz/robotframework-request-logger
repo_name: angel-valdezzz/robotframework-request-logger
copyright: Robot Framework Request Logger · HTTP console evidence
nav:
  - Inicio: index.md
  - Manual de usuario:
      - Uso y assertions: usage.md
      - Modos y ejemplos visuales: console.md
      - CI y compatibilidad: ci.md
  - Referencia de keywords: keywords/index.html
  - Desarrollo y publicación: development.md
theme:
  name: material
  language: es
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Modo claro
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - assets/external.js
