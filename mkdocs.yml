INHERIT: mkdocs.base.yml
docs_dir: docs/en
site_dir: site
edit_uri: edit/main/docs/en/
theme:
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Light mode
plugins:
  - search:
      lang: en
nav:
  - Home: index.md
  - User guide:
      - Usage and assertions: usage.md
      - CI and compatibility: ci.md
  - Keyword reference: keywords/index.html
  - Development and publishing: development.md
  - Visual examples: console.md
  - Themes: themes.md
